name: GitHub source collector canary

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/github-source-canary.yml"
      - "src/github_sources/**"
      - "qa/test_github_source_collector.py"
      - "qa/validate_github_workflow.py"
      - "qa/validate_repository_boundary.py"
      - ".gitignore"
      - ".env.example"
      - "docs/REPOSITORY_BOUNDARY.md"
      - "data/private-research/github-sources/fixtures/**"
      - "data/private-research/github-sources/source_registry.json"

permissions:
  contents: read

concurrency:
  group: github-source-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: ""

      - name: Run offline collector contract
        run: python -m unittest qa.test_github_source_collector -v

      - name: Validate public repository boundary
        run: python qa/validate_repository_boundary.py

      - name: Validate workflow security boundary
        run: python qa/validate_github_workflow.py

      - name: Produce metadata-only canary report
        run: python src/github_sources/collect_public_repo.py --report qa/github-source-canary.json --quiet

      - name: Upload non-secret canary report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-source-canary
          path: qa/github-source-canary.json
          if-no-files-found: error
          retention-days: 7
